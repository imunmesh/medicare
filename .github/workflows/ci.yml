name: CI Workflow

on:
  push:
    branches:
      - main
      - master
      - EXP-10
      - EXP-9
  pull_request:
    branches:
      - main
      - master
      - EXP-10

jobs:
  validate-and-build:
    name: Build & Validate Full-Stack App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          echo "Installing frontend dependencies using npm ci..."
          npm ci

      - name: Run Frontend Production Build
        working-directory: frontend
        run: |
          echo "Building frontend with Vite..."
          npm run build

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          echo "Installing backend dependencies using npm ci..."
          npm ci

      - name: Verify Backend Start Script & Entrypoint Syntax
        working-directory: backend
        run: |
          echo "Verifying backend package.json scripts..."
          node -e "const pkg = require('./package.json'); if (!pkg.scripts || !pkg.scripts.start) { console.error('❌ Error: Missing start script in backend/package.json'); process.exit(1); } console.log('✅ Backend start script verified:', pkg.scripts.start);"
          echo "Verifying server.js syntax..."
          node --check server.js
          echo "✅ Backend syntax check passed successfully."
